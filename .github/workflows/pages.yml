name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Cache downloaded tokenizers
        uses: actions/cache@v6
        with:
          path: vscode-extension/.cache
          key: tokenizers-${{ hashFiles('vscode-extension/models.json') }}
      - name: Build the built-in tokenizer pack
        working-directory: vscode-extension
        run: |
          npm ci
          npm run build:pack
          node scripts/build-web-pack.ts ../app/static/pack
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/static
      - id: deployment
        uses: actions/deploy-pages@v5
