name: VS Code extension

on:
  push:
    branches: [main]
    paths: ['vscode-extension/**', '.github/workflows/vscode-extension.yml']
    tags: ['vscode-v*']
  pull_request:
    paths: ['vscode-extension/**', '.github/workflows/vscode-extension.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Cache downloaded tokenizers
        uses: actions/cache@v6
        with:
          path: vscode-extension/.cache
          key: tokenizers-${{ hashFiles('vscode-extension/models.json') }}
      - run: npm ci
      - run: npm run build:pack
      - run: npm run build
      - run: npm run typecheck
      - run: npx vitest run
      - run: xvfb-run -a npm run test:ext
      - run: npm run package
      - name: Check .vsix size
        run: |
          size=$(stat -c %s *.vsix)
          echo "vsix size: $size bytes"
          test "$size" -le $((60 * 1024 * 1024))
      - uses: actions/upload-artifact@v7
        with:
          name: tokenmeter-vsix
          path: vscode-extension/*.vsix

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches package.json version
        run: |
          version=$(node -p "require('./vscode-extension/package.json').version")
          test "$GITHUB_REF_NAME" = "vscode-v$version" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: tokenmeter-vsix
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.vsix --generate-notes
